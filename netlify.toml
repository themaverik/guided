# Netlify deployment config for Guided.
# Next.js 15 App Router — the @netlify/plugin-nextjs runtime is applied
# automatically; API routes deploy as Netlify Functions.

[build]
command = "pnpm build"
publish = ".next"

[build.environment]
NODE_VERSION = "22"
# Match the ~1h retention stated in the privacy policy (lib/project-store.ts).
GUIDED_PROJECT_TTL_MIN = "60"

# Pinned locally (devDependency) so the version respects .npmrc's
# minimum-release-age guard; without this Netlify auto-installs latest.
[[plugins]]
package = "@netlify/plugin-nextjs"

# Storage: the site env var GUIDED_STORAGE=blobs (scope: All) selects the
# Netlify Blobs driver. lib/storage.ts also falls back to blobs on a deployed
# build; local runs — including `netlify dev` — stay on the fs driver.
# Server-side PDF export (Playwright) is unavailable on Netlify Functions; the
# route returns 501 and users can print the /<slug>/print route from the
# browser instead.
